<svg width="400" height="400" viewBox="-200 -200 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="0" cy="0" r="195" fill="#020b14" stroke="#00e5ff" stroke-width="4" filter="url(#neon-glow)"/>
  <!-- Concentric Rings -->
  <circle cx="0" cy="0" r="150" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="10,10" opacity="0.6"/>
  <circle cx="0" cy="0" r="100" fill="none" stroke="#00e5ff" stroke-width="1" stroke-dasharray="5,5" opacity="0.4"/>
  <circle cx="0" cy="0" r="50" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
  <!-- Crosshairs -->
  <line x1="-190" y1="0" x2="190" y2="0" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="-190" x2="0" y2="190" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>
  <line x1="-135" y1="-135" x2="135" y2="135" stroke="#00e5ff" stroke-width="1" stroke-dasharray="5,15" opacity="0.4"/>
  <line x1="-135" y1="135" x2="135" y2="-135" stroke="#00e5ff" stroke-width="1" stroke-dasharray="5,15" opacity="0.4"/>
  <!-- Central Player Blip -->
  <polygon points="0,-15 10,15 0,10 -10,15" fill="#00e5ff" filter="url(#neon-glow)"/>
</svg>