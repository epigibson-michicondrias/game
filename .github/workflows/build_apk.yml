name: Android APK Export CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  GODOT_VERSION: 4.2.1-stable

jobs:
  export-apk:
    name: Build & Export Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Godot Headless & Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -o godot.zip
          unzip godot.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot

          curl -L "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -o templates.tpz
          unzip templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}/

      - name: Setup Android Keystore and Export Preset
        run: |
          # Generate debug keystore for Android export if not preset
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Android Debug"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/android/SubAbyss-debug.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          antialiasing/msaa_2d=0
          antialiasing/msaa_3d=0
          antialiasing/xr_msaa_3d=0
          antialiasing/screen_space_roughness_limiter=false
          camera/low_processor_usage_mode=false
          camera/low_processor_usage_mode_sleep_usec=6900
          architectures/arm64-v8a=true
          architectures/x86_64=true
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          package/unique_name="com.subabyss.game"
          package/name="SubAbyss"
          package/signed=true
          EOF

      - name: Export Debug APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android Debug" build/android/SubAbyss-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubAbyss-debug-apk
          path: build/android/SubAbyss-debug.apk
          retention-days: 14
